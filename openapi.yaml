openapi: 3.0.4
info:
  title: VPN Proxy Detector
  description: >-
    VPN Proxy Detector checks any IP address to detect active VPN connections
    and cloud datacenter hosting. Lookups return boolean flags for VPN and
    datacenter status plus the verification date, with paid tiers adding Tor
    detection and risk levels.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/vpndetector:
    get:
      summary: VPN Proxy Detector
      description: >-
        VPN Detector is a simple tool for detecting VPN usage. It returns a
        boolean value indicating whether the IP address is using a VPN or not.
      operationId: vpndetector
      parameters:
        - name: ip
          in: query
          schema:
            type: string
          required: true
          description: The IP address you want to check for VPN usage
          example: 103.62.49.210
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ip: 103.62.49.210
                  is_vpn: false
                  is_datacenter: true
                  is_tor: false
                  asn: AS137409
                  asn_name: GSLNETWORKS-AS-AP GSL Networks Pty LTD
                  checked_on: '2026-09-14'
                  risk_level: Moderate
                  threat_level: Low
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
